<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intro animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Newsreader:ital,opsz@0,72;1,72&display=swap">
  <style>
    :root {
      --paper: #f9f8f6;
      --ink: #1f1f1e;
      --muted: #969696;
      --orange: #f2511b;
      --peach: #fdd1ba;
      --yellow: #f4e48c;
      --green: #c8d665;
      --blue: #add6f7;
      --pink: #f6a3c6;
      --serif: "Newsreader", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      /* Replaced at runtime with a sampled spring curve (see spring() below). */
      --spring: cubic-bezier(.3, 1.3, .5, 1);
      --spring-dur: .45s;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body { font-family: var(--mono); -webkit-font-smoothing: antialiased; }
    body.is-intro { overflow: hidden; }

    /* ---------- Hero (what the intro hands off to) ---------- */

    .hero { position: relative; height: 100vh; height: 100svh; min-height: 520px; }

    .nav {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; padding: 18px;
      background: var(--paper);
      font: 12px/1.65 var(--mono); letter-spacing: .01em; text-transform: uppercase;
    }
    .nav a { color: var(--muted); text-decoration: none; }
    .nav a:hover { color: var(--ink); }
    .nav nav { display: flex; gap: 20px; }

    .cards { position: absolute; left: 50%; top: 50%; z-index: 9; width: 799px; height: 425px; translate: -50% -50%; }

    .card { position: absolute; transition: transform var(--spring-dur) var(--spring); }
    .card:hover { transform: rotate(var(--tilt)) scale(1.05); }

    .card--note { top: 0; left: 74px; width: 440px; height: 325px; --tilt: -3deg; }
    .note {
      position: absolute; left: 50%; top: 50%; width: 398px; height: 253px;
      translate: -50% -50%; rotate: -11deg;
      padding: 46px 30px 0; margin: 0;
      background: var(--orange); color: var(--paper);
      font: 24px/1.2 var(--serif); letter-spacing: .01em;
    }
    .note::before { /* binder holes */
      --sq: linear-gradient(var(--paper), var(--paper));
      content: ""; position: absolute; top: 14px; left: 40px; right: 40px; height: 13px;
      background: var(--sq) 0 0, var(--sq) 25% 0, var(--sq) 50% 0, var(--sq) 75% 0, var(--sq) 100% 0;
      background-size: 13px 13px; background-repeat: no-repeat;
    }
    .note::after { /* ruled lines, under the text */
      content: ""; position: absolute; inset: 50px 0 0; z-index: -1;
      background: repeating-linear-gradient(transparent 0 27.8px, rgb(255 255 255 / .25) 27.8px 28.8px);
    }

    .card--bubble { right: 47px; bottom: 33px; width: 410px; height: 184px; --tilt: 3deg; }
    .bubble { position: absolute; left: 50%; top: 50%; width: 394px; height: 157px; translate: -50% -50%; rotate: 4deg; }
    .bubble svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bubble p {
      position: absolute; left: 28px; right: 28px; top: 46%; translate: 0 -50%; margin: 0;
      color: var(--orange); font: 20px/1.2 var(--mono); letter-spacing: .01em;
    }

    .card--hello { top: 66px; right: 125px; width: 127px; height: 94px; --tilt: 6deg; }
    .sticker {
      position: absolute; left: 50%; top: 8px; translate: -50% 0; rotate: 8deg;
      padding: 8px 18px 12px; background: var(--green); color: #444;
      font: italic 40px/1.1 var(--serif); white-space: nowrap;
    }

    .card--doodle { left: 72px; bottom: -4px; width: 131px; height: 134px; --tilt: -7deg; }
    .doodle { position: absolute; inset: 12px; rotate: -6deg; background: var(--blue); }
    .doodle svg { display: block; width: 100%; height: 100%; }

    /* ---------- Intro ---------- */

    .intro {
      position: fixed; inset: 0; z-index: 20; overflow: hidden; pointer-events: none;
      background: var(--paper); font-family: var(--serif);
      --d: min(26vh, 38vw);
    }
    .intro:not([data-ready]) > * { visibility: hidden; }

    .disc {
      position: absolute; left: 50%; top: 45%;
      width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
      border-radius: 50%;
    }
    .scene { position: absolute; inset: 0; }

    .scene--flood { display: grid; place-items: center; background: var(--orange); }
    .solo { font-size: min(80vh, 120vw); line-height: 1; color: var(--paper); }

    .scene--green { background: var(--green); }
    .big {
      position: absolute; top: 50%; left: -.06em; translate: 0 -50%;
      font-size: min(78vh, 58vw); line-height: 1; color: var(--paper); white-space: nowrap;
    }
    .big span { display: inline-block; transform-origin: 0 100%; }

    .scene--blue { display: grid; place-items: center; background: var(--blue); }
    .word { font-size: min(17vh, 20vw); line-height: 1; color: var(--ink); white-space: nowrap; }
    .word span { display: inline-block; position: relative; }
    .word .tittle { position: absolute; left: 0; top: 0; }

    @media (prefers-reduced-motion: reduce) { .intro { display: none; } }
  </style>
  <noscript><style>.intro { display: none; } body.is-intro { overflow: auto; }</style></noscript>
</head>
<body class="is-intro">
  <section class="hero">
    <header class="nav">
      <a href="/">Abhishek Tiwari</a>
      <nav><a href="#work">Work</a><a href="#lab">Lab</a><a href="#about">About</a></nav>
    </header>

    <div class="cards">
      <div class="card card--note">
        <p class="note">Hi, I'm Abhi. I design and build interfaces that move, react, and feel a little alive.</p>
      </div>
      <div class="card card--bubble">
        <div class="bubble">
          <svg viewBox="0 0 394 157" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 0H394V116L338 157H0Z" fill="var(--peach)"/>
            <path d="M394 116L338 157L344 121Z" fill="var(--orange)"/>
          </svg>
          <p>Right now: shipping product, sweating the easing curves, and sketching on the side...</p>
        </div>
      </div>
      <div class="card card--hello">
        <div class="sticker">hello!</div>
      </div>
      <div class="card card--doodle">
        <div class="doodle">
          <svg viewBox="0 0 100 100" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M30 84h40"/>
            <path d="M50 84c0-12-1-22 1-34"/>
            <path d="M50 70c-10 0-17-6-19-14 9-1 16 4 19 14Z"/>
            <path d="M51 61c9-1 16-8 17-16-9 0-15 6-17 16Z"/>
            <g fill="var(--pink)" stroke="none">
              <circle cx="51" cy="30" r="6"/><circle cx="60" cy="38" r="6"/><circle cx="42" cy="38" r="6"/><circle cx="51" cy="44" r="5"/>
            </g>
            <circle cx="51" cy="38" r="3.5" fill="var(--orange)" stroke="none"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <div class="intro" aria-hidden="true">
    <div class="disc" style="background: var(--pink)"></div>
    <div class="disc" style="background: var(--blue)"></div>
    <div class="disc" style="background: var(--yellow)"></div>
    <div class="scene scene--flood"><span class="solo"></span></div>
    <div class="scene scene--green"><div class="big"></div></div>
    <div class="scene scene--blue"><div class="word"></div></div>
  </div>

  <script>
    const NAME = 'abhi'; // the word the intro spells out, swap in your own

    // Timeline in seconds, measured frame by frame from the reference intro.
    const T = {
      rise: 0.08,    // a stack of discs rises from below
      flood: 0.44,   // the front disc bursts open, revealing the first letter
      drop: 0.9,     // the first letter falls out of frame
      pan: 1.08,     // cut to green: the remaining letters swing in one by one
      settle: 1.75,  // cut to blue: the whole word zooms out and the i gets its dot
      handoff: 2.35, // the intro slips behind the hero and fades away
    };

    // ?speed=0.25 plays the intro in slow motion; press R to replay it.
    const SPEED = Number(new URLSearchParams(location.search).get('speed')) || 1;

    // A spring described the way Framer does (bounce, duration), sampled into a CSS linear() curve.
    function spring(bounce, duration) {
      if (!CSS.supports('transition-timing-function', 'linear(0, 1)')) {
        return { dur: duration, ease: 'cubic-bezier(.3, 1.3, .5, 1)' };
      }
      const zeta = 1 - bounce;
      const wd = Math.sqrt(1 - zeta * zeta);
      const w0 = Math.log(1000 / wd) / (zeta * duration); // envelope decays to ~0.1% by `duration`
      const pts = [];
      for (let i = 0; i <= 50; i++) {
        const t = (i / 50) * duration;
        const x = 1 - Math.exp(-zeta * w0 * t) * (Math.cos(w0 * wd * t) + (zeta / wd) * Math.sin(w0 * wd * t));
        pts.push(i === 50 ? 1 : +x.toFixed(4));
      }
      return { dur: duration, ease: `linear(${pts.join(', ')})` };
    }

    const soft = spring(0.2, 0.4);    // Framer's default transition, used for the hand-off fade
    const swing = spring(0.45, 0.45); // letters swinging into the green line
    const bob = spring(0.35, 0.35);   // letters bobbing into place on blue
    const hover = spring(0.25, 0.45); // card hover: rotate + scale(1.05)
    document.documentElement.style.setProperty('--spring', hover.ease);
    document.documentElement.style.setProperty('--spring-dur', `${hover.dur}s`);

    const intro = document.querySelector('.intro');
    const discs = [...intro.querySelectorAll('.disc')];
    const flood = intro.querySelector('.scene--flood');
    const solo = intro.querySelector('.solo');
    const green = intro.querySelector('.scene--green');
    const big = intro.querySelector('.big');
    const blue = intro.querySelector('.scene--blue');
    const word = intro.querySelector('.word');

    // Build the letters. A trailing i is drawn dotless so its dot can arrive on its own.
    const glyphs = [...NAME];
    const dotted = glyphs.at(-1) === 'i';
    if (dotted) glyphs[glyphs.length - 1] = 'ı';
    const letter = (c) => Object.assign(document.createElement('span'), { textContent: c });
    solo.textContent = glyphs[0];
    big.append(...glyphs.slice(1).map(letter));
    word.append(...glyphs.map(letter));
    let tittle = null;
    if (dotted) {
      tittle = Object.assign(document.createElement('span'), { className: 'tittle', textContent: 'i' });
      word.lastChild.append(tittle);
    }

    // The dot is a real "i" laid over the dotless one and clipped to everything above the stem,
    // so it matches the font exactly. The cut line comes from the font's own metrics.
    function tittleClip() {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '100px Newsreader';
      const i = ctx.measureText('i');
      const stem = ctx.measureText('ı');
      if (!i.fontBoundingBoxAscent) return 'inset(0 0 55% 0)';
      const baseline = (100 - i.fontBoundingBoxAscent - i.fontBoundingBoxDescent) / 2 + i.fontBoundingBoxAscent;
      const cut = (baseline - stem.actualBoundingBoxAscent - 1) / 100;
      return `inset(0 0 calc(100% - ${cut}em) 0)`;
    }

    let anims = [];

    function at(t, el, keyframes, { dur = 0.001, ease = 'linear' } = {}) {
      const a = el.animate(keyframes, { delay: t * 1000, duration: dur * 1000, easing: ease, fill: 'both' });
      a.finished.catch(() => {}); // a replay cancels in-flight animations
      anims.push(a);
      return a;
    }
    const show = (t, el) => at(t, el, [{ opacity: 0 }, { opacity: 1 }]);

    function play() {
      anims.forEach((a) => a.cancel());
      anims = [];
      intro.hidden = false;
      document.body.classList.add('is-intro');

      const w = innerWidth;
      const h = innerHeight;
      const d = discs[0].offsetWidth;
      const below = h * 0.55 + d;
      const lift = { dur: 0.39, ease: 'cubic-bezier(.65, 0, .35, 1)' };

      // 1. A stack of discs rises from below. The front (orange) disc is the flood layer itself,
      //    clipped to a circle, so the next step is just growing that circle.
      [...discs, flood].forEach((el, i, all) => {
        const depth = all.length - 1 - i;
        at(T.rise + depth * 0.025, el, [
          { transform: `translateY(${below}px)` },
          { transform: `translateY(${depth * d * 0.09}px)` },
        ], lift);
      });

      // 2. The front disc bursts open to fill the screen, revealing the first letter.
      at(T.flood, flood, [
        { clipPath: `circle(${d / 2}px at 50% 45%)` },
        { clipPath: `circle(${Math.hypot(w, h)}px at 50% 45%)` },
      ], { dur: 0.07, ease: 'cubic-bezier(.5, 0, .75, 0)' });
      show(T.flood, solo);

      // 3. The letter drops out of frame.
      at(T.drop, solo, [{ transform: 'none' }, { transform: `translateY(${h}px)` }],
        { dur: 0.17, ease: 'cubic-bezier(.55, 0, 1, .45)' });

      // 4. Hard cut to green. The rest of the word, huge and cropped, swings in letter by letter.
      show(T.pan, green);
      const step = Math.min(0.17, 0.5 / Math.max(big.children.length, 1));
      [...big.children].forEach((el, i) => {
        const t = T.pan + i * step;
        show(t, el);
        at(t, el, [{ transform: 'translateY(18%) rotate(22deg)' }, { transform: 'none' }], swing);
      });

      // 5. Hard cut to blue. Zoom out to the whole word while the letters bob into line.
      show(T.settle, blue);
      at(T.settle, word, [{ transform: 'scale(1.18)' }, { transform: 'none' }], soft);
      [...word.children].forEach((el, i) => {
        at(T.settle + i * 0.025, el, [{ transform: `translateY(${i % 2 ? 0.2 : -0.2}em)` }, { transform: 'none' }], bob);
      });

      // 6. The i's dot drops in from the top right.
      if (tittle) {
        at(T.settle, tittle, [{ transform: 'translate(1.2em, -1.5em)' }, { transform: 'none' }],
          { dur: 0.24, ease: 'cubic-bezier(.2, .7, .3, 1)' });
      }

      // 7. Hand-off. The intro drops below the hero (the nav and cards are suddenly on top)
      //    and fades out underneath them.
      const handoff = at(T.handoff, intro, [{ zIndex: 20 }, { zIndex: 0 }]);
      const fade = at(T.handoff, intro, [{ opacity: 1 }, { opacity: 0 }], soft);

      anims.forEach((a) => (a.playbackRate = SPEED));
      intro.dataset.ready = '';

      handoff.finished.then(() => document.body.classList.remove('is-intro'), () => {});
      fade.finished.then(() => {
        intro.hidden = true;
        anims.forEach((a) => a.cancel());
        anims = [];
      }, () => {});
    }

    // Scale the card cluster down on small screens.
    const cards = document.querySelector('.cards');
    const fit = () => (cards.style.scale = String(Math.min(1, (innerWidth - 32) / 800, (innerHeight - 96) / 440)));
    fit();
    addEventListener('resize', fit);

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      intro.hidden = true;
      document.body.classList.remove('is-intro');
    } else {
      Promise.race([
        document.fonts.load('100px Newsreader'),
        new Promise((r) => setTimeout(r, 2000)),
      ]).then(() => {
        if (tittle) tittle.style.clipPath = tittleClip();
        play();
      });
      addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey) play();
      });
    }
  </script>
</body>
</html>
